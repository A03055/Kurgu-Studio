name: Uygulamayı derle (Windows / Mac / Linux)

on:
  push:
    branches: ['main', 'master', 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
            name: KurguStudio-Windows
            files: dist/*.exe
          - os: macos-latest
            args: --mac
            name: KurguStudio-Mac
            files: dist/*.dmg
          - os: ubuntu-latest
            args: --linux
            name: KurguStudio-Linux
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Derle
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Dosyaları yükle (Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Sürüm (release) yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
